services:
  pgsparklite:
    build: .
    image: pgsparklite:latest
    container_name: pgsparklite
    restart: unless-stopped
    # Bluetooth sockets only exist in the host network namespace
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      # Set your amp address to skip discovery (see utils/find_spark_bt_address.py)
      AMP_BT_ADDRESS: ${AMP_BT_ADDRESS:-}
      # Web port (host networking: use 80 to drop the port from the URL)
      FLASK_RUN_PORT: ${PGSPARKLITE_PORT:-5000}
      # Relay the official Spark app through this host (needs /run/dbus).
      # Initial values only, then edited in Settings (data/spark_app_proxy.json)
      SPARK_APP_PROXY: ${SPARK_APP_PROXY:-0}
      SPARK_APP_PROXY_NAME: ${SPARK_APP_PROXY_NAME:-}
      SPARK_APP_PROXY_DEVICES: ${SPARK_APP_PROXY_DEVICES:-}
    volumes:
      - ./data:/data
      - /run/dbus:/run/dbus
