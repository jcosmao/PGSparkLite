# Reverse proxy for the apps hosted on this box.
# One file per app in conf.d/ (server_name <app>.lan).
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Unknown host names: refuse instead of serving the first app
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        ssl_certificate     /etc/nginx/certs/lan.crt;
        ssl_certificate_key /etc/nginx/certs/lan.key;
        return 444;
    }

    include /etc/nginx/conf.d/*.conf;
}
